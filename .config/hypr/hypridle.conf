# Screenlock
listener {
    timeout = 600                     # 10 min
    on-timeout = loginctl lock-session
    # on-resume = notify-send "Welcome back to your desktop!"  # command to run when activity is detected after timeout has fired.
}

# Suspend
listener {
    timeout = 1200                            # 20 min
    on-timeout = systemctl suspend # command to run when timeout has passed
    # on-resume = notify-send "Welcome back to your desktop!"  # command to run when activity is detected after timeout has fired.
}

# Snow
listener {
    timeout = 300                            # 5 min
    on-timeout = ~/Documents/Proiect_hub/hyprsnowC/hyprsnow/target/release/hyprsnow --intensity 7 --drift 10 --speed-min 40
    on-resume = killall hyprsnow
    # ignore_inhibit = true
}
